  .bar .title { margin-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .score { margin-left: auto; color: var(--yellow); white-space: nowrap; }
  .screen {
    flex: 1; overflow: auto; position: relative;
    padding: 14px 16px 18px;
    cursor: text;
  }
  .blk { margin: 0; white-space: pre; font: inherit; }
  .blk.wrap { white-space: pre-wrap; word-break: break-word; }
  .echo .ps, .input-line .ps { color: var(--green); }
  .notice { color: var(--yellow); }
  .error { color: var(--red); }
  .dim { color: var(--dim); }
  .hl { color: var(--blue); }
  .kw { color: var(--purple); }
  .gap { height: 10px; }
  a.cmd { color: var(--green); text-decoration: underline dotted; cursor: pointer; }
  .input-line { display: flex; align-items: baseline; gap: 0; }
  .input-line .ps { white-space: pre; }
  .input-line input {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--ink); font: inherit; caret-color: var(--green);
    padding: 0;
  }
  .chips {
    width: 100%; max-width: 1000px;
    margin-top: 14px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .chips .lbl { color: var(--dim); font-size: 12.5px; margin-right: 2px; }
  .chip {
    font: inherit; font-size: 12.5px;

  .foot { margin-top: 18px; color: var(--dim); font-size: 12px; text-align: center; }
  @media (max-width: 640px) {

  /* ---------------- text helpers ---------------- */
  // Clickable command marker: \u0001cmd\u0002 (not counted in width)
  function C(s) { return '\u0001' + s + '\u0002'; }
  function vis(s) { return Array.from(String(s).replace(/[\u0001\u0002]/g, '')).length; }
  function pad(s, n) { return s + ' '.repeat(Math.max(0, n - vis(s))); }
  function center(s, n) { var l = Math.floor((n - vis(s)) / 2); return ' '.repeat(Math.max(0, l)) + pad(s, n - Math.max(0, l)); }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function html(s) {
    var h = esc(s);
    h = h.replace(/\u0001([^\u0002]*)\u0002/g, function (_, c) { return '<a class="cmd" data-cmd="' + c.replace(/"/g, '&quot;') + '">' + c + '</a>'; });
    h = h.replace(/(https?:\/\/[^\s|]+[^\s|.,)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/(^|[\s|])mailto:([^\s|]+)/g, '$1<a href="mailto:$2">$2</a>');
    h = h.replace(/(Donskoi_Viktor_CV_(RU|EN)\.pdf)/g, '<a href="$1" download>$1</a>');
    return h;
  }

  function avail() { return Math.floor((screen.clientWidth - 34) / charW()); }

  function table(head, rows, title) {
    var w = head.map(function (h, i) { return Math.max(vis(h), rows.reduce(function (m, r) { return Math.max(m, vis(r[i])); }, 0)); });
    var last = w.length - 1;
    var fixed = w.slice(0, last).reduce(function (a, b) { return a + b; }, 0) + 3 * last + 2;
    // Narrow screen: wrap the last column like a multi-line psql value.
    if (fixed + w[last] > avail() && avail() - fixed >= 12) w[last] = avail() - fixed;
    var total = fixed + w[last];
    var lines = [];
    if (title) lines.push(center(title, total));
    lines.push(' ' + head.map(function (h, i) { return center(h, w[i]); }).join(' | ') + ' ');
    lines.push(w.map(function (n) { return '-'.repeat(n + 2); }).join('+'));
    rows.forEach(function (r) {
      var parts = vis(r[last]) > w[last] && r[last].indexOf('\u0001') < 0 ? wrapText(r[last], w[last]) : [r[last]];
      parts.forEach(function (p, j) {
        var cells = r.slice(0, last).map(function (c, i) { return pad(j === 0 ? c : '', w[i]); });
        cells.push(j < parts.length - 1 ? pad(p, w[last]) + '+' : p);
        lines.push((' ' + cells.join(' | ')).replace(/\s+$/, ''));
      });
    });
    lines.push('(' + rows.length + (rows.length === 1 ? ' row)' : ' rows)'));
    return lines.join('\n');
  }

  function wrapText(s, width) {
    var words = s.split(' '), lines = [], cur = '';
    words.forEach(function (w) {
      if (cur && vis(cur + ' ' + w) > width) { lines.push(cur); cur = w; } else { cur = cur ? cur + ' ' + w : w; }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function expanded(keys, records) {
    var kw = keys.reduce(function (m, k) { return Math.max(m, vis(k)); }, 0);
    var width = Math.max(20, Math.min(68, avail() - kw - 5));
    var lines = [];
    records.forEach(function (rec, i) {
      var hdr = '-[ RECORD ' + (i + 1) + ' ]';
      lines.push(hdr + '-'.repeat(Math.max(0, kw + 1 - hdr.length)) + '+' + '-'.repeat(width + 2));
      keys.forEach(function (k) {
        if (Array.isArray(rec[k]) && !rec[k].length) return;
        var v = rec[k];
        var parts = [];
        (Array.isArray(v) ? v.map(function (x) { return '• ' + x; }) : [String(v)]).forEach(function (p) {
          parts = parts.concat(wrapText(p, width));
        });
        if (!parts.length) parts = [''];
        parts.forEach(function (p, j) {
          lines.push(pad(j === 0 ? k : '', kw) + ' | ' + (j < parts.length - 1 ? pad(p, width) + ' +' : p));
        });
      });
    });
    return lines.join('\n');
  }

  var _cw = 0;
  function charW() {
    if (_cw) return _cw;
    var s = document.createElement('span'); s.className = 'blk'; s.style.visibility = 'hidden'; s.textContent = 'x'.repeat(100);
    out.appendChild(s); _cw = s.getBoundingClientRect().width / 100 || 8; out.removeChild(s);
    return _cw;
  }

  /* ---------------- output ---------------- */
  function print(text, cls) {
    var pre = document.createElement('pre');
    pre.className = 'blk' + (cls ? ' ' + cls : '');
    pre.innerHTML = html(text);
    out.appendChild(pre);
  }
  function printLines(text) {
    // colour NOTICE/ERROR/HINT/DETAIL lines
    text.split('\n').forEach(function (l) {
      var c = /^(ERROR|FATAL)/.test(l) ? 'error' : /^(NOTICE|DETAIL|HINT|WARNING)/.test(l) || /^ {9}\S/.test(l) ? 'notice' : '';
      print(l, c);
    });
  }
  function gap() { var d = document.createElement('div'); d.className = 'gap'; out.appendChild(d); }
  function echo(cmd) {
    var pre = document.createElement('pre'); pre.className = 'blk echo wrap';
    pre.innerHTML = '<span class="ps">resume=# </span>' + esc(cmd);
    out.appendChild(pre);
    lastEcho = pre;
  }
  var lastEcho = null;
  function scroll() {
    var max = screen.scrollHeight - screen.clientHeight;
    screen.scrollTop = lastEcho ? Math.min(max, lastEcho.offsetTop - 12) : max;
  }

  /* ---------------- achievements ---------------- */
  function score() { return ACH.reduce(function (s, a) { return s + (got[a[0]] ? a[2] : 0); }, 0); }
  function updateScore() {
    var n = ACH.filter(function (a) { return got[a[0]]; }).length;
    document.getElementById('score').textContent = n ? '🏆 ' + n + '/' + ACH.length + ' · ' + T().score + ' ' + score() : '';
  }
  function unlock(id) {
    if (got[id]) return;
    got[id] = 1; save('ach', got);
    var a = ACH.filter(function (x) { return x[0] === id; })[0];
    var t = T().ach[id];
    print('NOTICE:  ' + MEDAL[a[1]] + ' [' + a[1] + '] ' + T().unlocked + ': ' + t[0] + ' (+' + a[2] + ')', 'notice wrap');
    print('DETAIL:  ' + t[1] + ' ' + T().total + ': ' + score() + '.', 'notice wrap');
    updateScore();
  }
  function see(t) {
    seen[t] = 1; save('seen', seen);
    if (['about_me', 'projects', 'skills', 'education', 'languages', 'contacts'].every(function (k) { return seen[k]; })) unlock('explorer');
  }

  /* ---------------- commands ---------------- */
  function cmdHelp() {
    var t = T();
    var w = t.help.reduce(function (m, h) { return Math.max(m, vis(h[0])); }, 0);
    print(t.help.map(function (h) { return '  ' + C(h[0]) + ' '.repeat(w - vis(h[0]) + 3) + '-- ' + h[1]; }).join('\n'));
    print(t.helpFoot, 'dim wrap');
    unlock('rtfm');
  }
  function cmdRelations() {
    var t = T();
    print(table(t.relHead, t.tables.map(function (r) { return ['resume', C(r[0]), 'table', r[1]]; }), t.relTitle));
  }
  function cmdSelect(tbl) {
    var t = T();
    switch (tbl) {
      case 'about_me': case 'about': case 'me':
        print(table(['field', 'value'], t.about)); see('about_me'); return true;
      case 'projects': case 'project':
        print(expanded(t.projKeys, t.projects)); see('projects'); return true;
      case 'extensions': case 'pg_extension':
        cmdDx(); return true;
      case 'skills':
        print(table(t.skillsHead, t.skills)); see('skills'); return true;
      case 'education':
        print(table(t.eduHead, t.edu)); print(t.eduNote, 'dim wrap'); see('education'); return true;
      case 'languages': case 'language':
        print(table(t.langsHead, t.langs)); see('languages'); return true;
      case 'contacts': case 'contact':
        print(table(t.contactsHead, t.contacts.map(function (r) { return [r[0], r[1] === '\\pdf' ? C('\\pdf') : r[1]]; }))); see('contacts'); return true;
      case 'achievements':
        print(table(t.achHead, ACH.map(function (a) {
          var tt = t.ach[a[0]];
          return [got[a[0]] ? MEDAL[a[1]] : '🔒', got[a[0]] ? tt[0] : '???', tt[1]];
        })));
        print(t.total + ': ' + score(), 'notice');
        return true;
    }
    return false;
  }
  function cmdDx() {
    var t = T();
    print(table(t.dxHead, t.dx.map(function (r) { return r; }), t.dxTitle));
    print('-- ' + C('SELECT * FROM projects;'), 'dim');
  }
  function cmdPdf() {
    print(T().pdfLinks, 'wrap');
    var a = document.createElement('a'); a.href = T().pdf; a.download = T().pdf; document.body.appendChild(a); a.click(); a.remove();
    unlock('pdf');
  }
  function setLang(l, announce) {
    if (!D[l]) return;
    var changed = l !== lang;
    lang = l; save('lang', l);
    applyUI();
    if (announce) { print(T().langSwitched); if (changed) { unlock('poly'); gap(); cmdSelect('about_me'); } }
  }

  function run(raw) {
    var cmd = raw.trim();
    echo(raw);
    if (!cmd) { scroll(); return; }
    hist.push(cmd); hpos = hist.length;
    unlock('first');
    var s = cmd.replace(/;+\s*$/, '').trim();
    var low = s.toLowerCase().replace(/\s+/g, ' ');
    var t = T();
    var m;

    if (low === 'help' || low === '\\?' || low === '\\h' || low === 'помощь' || low === '?') cmdHelp();
    else if (low === 'clear' || low === '\\! clear' || low === 'cls') { out.innerHTML = ''; lastEcho = null; }
    else if (low === '\\d' || low === '\\dt' || low === '\\dt+' || low === '\\d+') cmdRelations();
    else if (low === '\\dx' || low === '\\dx+') cmdDx();
    else if (low === '\\l') print(table(['Name', 'Owner', 'Encoding'], [['resume', 'viktor', 'UTF8']], 'List of databases'));
    else if (low === '\\pdf' || low === 'pdf') cmdPdf();
    else if ((m = low.match(/^\\lang\s+(ru|en)$/)) || (m = low.match(/^set\s+lang(?:uage)?\s*(?:=|to)\s*'?(ru|en)'?$/))) setLang(m[1], true);
    else if (low === '\\lang') print('\\lang ru | \\lang en');
    else if (low === '\\q' || low === 'exit' || low === 'quit') print(t.quit, 'wrap');
    else if (low === '\\conninfo') print('You are connected to database "resume" as user "recruiter" via socket in "/var/run/hope".', 'wrap');
    else if (/^select\s+version\s*\(\s*\)$/.test(low)) print(table(['version'], [['PostgreSQL 19.1 (Viktor edition) on x86_64-pc-linux-gnu, compiled with love']]));
    else if (/^select\s+1$/.test(low)) print(table(['?column?'], [['1']]));
    else if (/^select\s+now\s*\(\s*\)$/.test(low)) print(table(['now'], [[new Date().toISOString().replace('T', ' ').slice(0, 19) + '+00 (a good time to hire)']]));
    else if (/\bhire\b/.test(low)) { printLines(t.hireMsg); unlock('hire'); }
    else if ((m = low.match(/^(?:select|table)\s+(?:.+?\s+from\s+)?([a-z_\.]+)(\s+where\b.*)?(\s+order\b.*)?(\s+limit\b.*)?$/)) ) {
      var tbl = m[1].replace(/^(resume|public)\./, '');
      if (!cmdSelect(tbl)) print('ERROR:  relation "' + tbl + '" ' + t.noTable + '\n' + t.syntaxHint, 'error wrap');
    }
    else if (/^update\b/.test(low)) {
      if (/\bwhere\b/.test(low)) print('UPDATE 0');
      else { print('UPDATE 1042'); print(t.updateHint, 'notice wrap'); unlock('where'); }
    }
    else if (/^(drop|truncate)\b/.test(low)) { printLines(t.dropErr); unlock('drop'); }
    else if (/^delete\b/.test(low)) { printLines(t.deleteErr); if (!/\bwhere\b/.test(low)) unlock('where'); }
    else if (/^insert\b/.test(low)) printLines(t.insertMsg);
    else if (/^(begin|commit|rollback)$/.test(low)) print(low.toUpperCase());
    else {
      var tok = s.split(/\s+/)[0];
      print('ERROR:  syntax error at or near "' + tok + '"\nLINE 1: ' + s + '\n        ^\n' + t.syntaxHint, 'error wrap');
    }
    gap();
    scroll();
  }

  /* typing effect for clicks */
  function type(cmd) {
    if (busy) return;
    busy = true; inp.value = '';
    var i = 0;
    var speed = Math.max(8, Math.min(28, 600 / cmd.length));
    (function step() {
      if (i <= cmd.length) { inp.value = cmd.slice(0, i++); setTimeout(step, speed); }
      else { inp.value = ''; run(cmd); busy = false; inp.focus({ preventScroll: true }); }
    })();
  }

  /* ---------------- UI ---------------- */
  function applyUI() {
    var t = T();
    document.documentElement.lang = t.htmlLang;
    document.getElementById('h-name').textContent = t.name;
    document.getElementById('h-role').textContent = t.role;
    var pdf = document.getElementById('pdf-btn'); pdf.href = t.pdf; pdf.setAttribute('download', t.pdf);
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === lang); });
    var chips = document.getElementById('chips');
    chips.innerHTML = '<span class="lbl">' + esc(t.try) + '</span>';
    t.chips.forEach(function (c) {
      var b = document.createElement('button'); b.className = 'chip'; b.textContent = c[0]; b.title = c[1];
      b.addEventListener('click', function () { type(c[1]); });
      chips.appendChild(b);
    });
    document.getElementById('foot').textContent = t.foot;
    updateScore();
  }

  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () { if (b.dataset.lang !== lang) type('\\lang ' + b.dataset.lang); });
  });
  document.getElementById('pdf-btn').addEventListener('click', function () { unlock('pdf'); });

  out.addEventListener('click', function (e) {
    var a = e.target.closest('a.cmd');
    if (a) { e.preventDefault(); type(a.dataset.cmd); }
  });
  screen.addEventListener('click', function () {
    if (!window.getSelection().toString()) inp.focus({ preventScroll: true });
  });

  var COMPLETE = ['SELECT * FROM ', 'about_me;', 'projects;', 'skills;', 'education;', 'languages;', 'contacts;', 'achievements;', 'help', 'clear', '\\dx', '\\d', '\\pdf', '\\lang ru', '\\lang en',"SELECT hire('viktor');"];
  inp.addEventListener('keydown', function (e) {
    if (busy) { e.preventDefault(); return; }
    if (e.key === 'Enter') { var v = inp.value; inp.value = ''; run(v); }
    else if (e.key === 'ArrowUp') { if (hpos > 0) { inp.value = hist[--hpos]; } e.preventDefault(); }
    else if (e.key === 'ArrowDown') { if (hpos < hist.length) { hpos++; inp.value = hist[hpos] || ''; } e.preventDefault(); }
    else if (e.key === 'Tab') {
      e.preventDefault();
      var v = inp.value, word = v.split(/\s+/).pop().toLowerCase();
      var opts = COMPLETE.filter(function (c) { return v && (c.toLowerCase().indexOf(v.toLowerCase()) === 0 || (word && c.toLowerCase().indexOf(word) === 0)); });
      if (opts.length === 1) inp.value = opts[0].toLowerCase().indexOf(v.toLowerCase()) === 0 ? opts[0] : v.slice(0, v.length - word.length) + opts[0];
      else if (opts.length > 1) { echo(v); print(opts.join('   '), 'dim wrap'); scroll(); }
    }
    else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); out.innerHTML = ''; }
  });

  /* ---------------- boot ---------------- */
  applyUI();
  print(T().banner, 'dim wrap');
  gap();
  setTimeout(function () { type('SELECT * FROM about_me;'); }, 400);
})();
</script>
</body>
